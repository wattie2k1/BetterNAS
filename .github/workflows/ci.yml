name: CI
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make test
      - run: make build build-arm64

  image:
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
      - run: make builder rootfs iso VERSION=0.0.0-ci-${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: iso
          path: dist/*.iso
