name: Release

# Ein Tag veröffentlicht ein Update:
#   vX.Y.Z      -> Kanäle stable und testing
#   vX.Y.Z-rcN  -> Kanal testing (Paketversion X.Y.Z~rcN)
on:
  push:
    tags: ['v*']

permissions: {}

jobs:
  # Tag prüfen und Paketversion/Kanal ableiten – ungültige Tags brechen hier ab, bevor etwas gebaut wird.
  meta:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      channel: ${{ steps.v.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          out="$(tools/deb-version.sh "$TAG")"
          echo "version=${out% *}" >> "$GITHUB_OUTPUT"
          echo "channel=${out#* }" >> "$GITHUB_OUTPUT"

  test:
    needs: meta
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg git
      - run: cd frontend && npm ci --no-audit --no-fund
      - run: make test

  build:
    needs: [meta, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: "1.24"
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"
      - run: make build web VERSION="$VERSION"
      - run: packaging/build-deb.sh amd64 "$VERSION"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deb
          path: dist/betternas_*_amd64.deb
          if-no-files-found: error

  # Signieren und Veröffentlichen: nur hier ist der Signierschlüssel erreichbar (Environment mit Pflicht-Freigabe).
  publish:
    needs: [meta, build]
    runs-on: ubuntu-24.04
    environment: release
    concurrency:
      group: release-publish
      cancel-in-progress: false
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      CHANNEL: ${{ needs.meta.outputs.channel }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deb
          path: dist
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends apt-utils gnupg
      - name: APT-Repo signieren und auf gh-pages veröffentlichen
        env:
          APT_SIGNING_KEY: ${{ secrets.APT_SIGNING_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -n "$APT_SIGNING_KEY" ] || { echo "FEHLER: Secret APT_SIGNING_KEY ist leer – es wird nichts veröffentlicht" >&2; exit 1; }
          umask 077
          key="$(mktemp)"
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$APT_SIGNING_KEY" > "$key"
          if [ "$CHANNEL" = stable ]; then suites="stable testing"; else suites="testing"; fi
          # Anmeldung nur für diesen Push (die Checkout-Anmeldung ist bewusst abgeschaltet).
          export GIT_CONFIG_COUNT=1
          export GIT_CONFIG_KEY_0="http.https://github.com/.extraheader"
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          # shellcheck disable=SC2086
          BNAS_APT_KEY="$key" tools/publish-pages.sh "https://github.com/${GITHUB_REPOSITORY}.git" \
            packaging/apt/betternas-archive-keyring.gpg "dist/betternas_${VERSION}_amd64.deb" $suites
      - name: GitHub-Release anlegen
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          flags=""
          [ "$CHANNEL" = testing ] && flags="--prerelease"
          # shellcheck disable=SC2086
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag --title "BetterNAS ${VERSION}" --generate-notes $flags dist/*.deb
