source /boot/grub/config.cfg

set timeout=5
set default=0

menuentry "BetterNAS installieren" --hotkey=i {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@
	initrd	@INITRD_LIVE@
}

menuentry "BetterNAS installieren (abgesicherter Grafikmodus)" {
	linux	@KERNEL_LIVE@ @APPEND_LIVE@ nomodeset
	initrd	@INITRD_LIVE@
}

if [ "${grub_platform}" = "efi" ]; then
	menuentry "UEFI-Firmware-Einstellungen" {
		fwsetup
	}
fi
